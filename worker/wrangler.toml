name = "opensvitlobot"
main = "src/index.ts"
compatibility_date = "2026-03-24"

[triggers]
crons = ["* * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "opensvitlobot-db"
database_id = "24b99f79-e8a8-4676-b9ee-0de6ca60c9c0"

# Browser Run (ex Browser Rendering): renders the chart PNG; quickAction() needs compatibility_date >= 2026-03-24.
[browser]
binding = "BROWSER"

[vars]
CORS_ORIGIN = "*"
OUTAGE_GROUP = "GPV6.2"

# Workers Logs: keeps console output, exceptions and CPU time per invocation
# (Dashboard → Workers → opensvitlobot → Logs; also queryable via the Cloudflare observability MCP).
[observability.logs]
enabled = true
invocation_logs = true

[observability.traces]
enabled = false
